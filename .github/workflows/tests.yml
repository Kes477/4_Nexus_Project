
name: Pruebas automatizadas Nexus

on:
  push:
    branches:
      - main
      - pruebas/nexus
  pull_request:
    branches:
      - main

jobs:
  pruebas-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: nexus_ci_user
          POSTGRES_PASSWORD: nexus_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_ci_user -d nexus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: clave-temporal-exclusiva-para-pruebas-ci
      DJANGO_DEBUG: "False"
      DB_NAME: nexus_ci
      DB_USER: nexus_ci_user
      DB_PASSWORD: nexus_ci_password
      DB_HOST: localhost
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuracion Django
        run: python manage.py check

      - name: Ejecutar pruebas automatizadas
        run: python manage.py test --verbosity 1
